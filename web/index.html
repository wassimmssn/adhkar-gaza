    // ── Client-Side AES-256-GCM Storage Encryption (Web Crypto API) ───────
    (function() {
      const ENC_PREFIX = 'enc:v1:';
      const DEVICE_KEY_STORAGE = '_ag_dk_v1';
      let cachedAesKey = null;

      function bytesToBase64(bytes) {
        let binary = '';
        for (let i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      function base64ToBytes(b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      async function getDerivedKey() {
        if (cachedAesKey) return cachedAesKey;
        let secretB64 = localStorage.getItem(DEVICE_KEY_STORAGE);
        if (!secretB64) {
          const rand = crypto.getRandomValues(new Uint8Array(32));
          secretB64 = bytesToBase64(rand);
          localStorage.setItem(DEVICE_KEY_STORAGE, secretB64);
        }
        const keyMaterial = await crypto.subtle.importKey(
          'raw',
          base64ToBytes(secretB64),
          'PBKDF2',
          false,
          ['deriveKey']
        );
        const salt = new TextEncoder().encode(window.location.origin + ':adhkar-gaza-v1');
        cachedAesKey = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
        return cachedAesKey;
      }

      window.adhkarCryptoEncrypt = async function(plaintext) {
        if (!plaintext || !window.crypto || !window.crypto.subtle) return plaintext;
        const key = await getDerivedKey();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(plaintext);
        const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, encoded);
        return ENC_PREFIX + bytesToBase64(iv) + ':' + bytesToBase64(new Uint8Array(cipherBuf));
      };

      window.adhkarCryptoDecrypt = async function(payload) {
        if (!payload || typeof payload !== 'string' || !payload.startsWith(ENC_PREFIX)) return payload || '';
        if (!window.crypto || !window.crypto.subtle) return '';
        const parts = payload.slice(ENC_PREFIX.length).split(':');
        if (parts.length !== 2) return '';
        const iv = base64ToBytes(parts[0]);
        const cipherBytes = base64ToBytes(parts[1]);
        const key = await getDerivedKey();
        const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, cipherBytes);
        return new TextDecoder().decode(plainBuf);
      };
    })();

    // ── Google Sign-In Popup & GIS Listener ───────────────────────────────
    const GOOGLE_CLIENT_ID = '712885191318-46e55srndlla0f7eo7qb761p1kfhhnub.apps.googleusercontent.com';

    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    function handleGoogleCredentialResponse(response) {
      if (!response || !response.credential) return;
      const profile = parseJwt(response.credential);
      if (!profile) return;

      const authData = {
        type: 'GOOGLE_SIGN_IN_SUCCESS',
        displayName: profile.name || profile.given_name || 'Utilisateur Google',

      try {

      } catch(e) {}
      window.dispatchEvent(new CustomEvent('google-auth-success', { detail: JSON.stringify(authData) }));
    }

    window.initOfficialGoogleAuth = function() {
      if (window.google && window.google.accounts && window.google.accounts.id) {
        window.google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleCredentialResponse,
          auto_select: false,

        });
      }
      initGoogleOAuthClient();
    };

    let tokenClient = null;

      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        tokenClient = google.accounts.oauth2.initTokenClient({

          scope: 'https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
          callback: async (tokenResponse) => {
            if (tokenResponse && tokenResponse.access_token) {

                const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                  headers: { Authorization: 'Bearer ' + tokenResponse.access_token }
                });
                const profile = await res.json();
                const authData = {

                  displayName: profile.name || profile.given_name || 'Utilisateur Google',
                  email: profile.email,
                  photoUrl: profile.picture || '',
                  accessToken: tokenResponse.access_token
                };
                try {
                  localStorage.setItem('auth_google_pending_login', JSON.stringify(authData));
                } catch(e) {}
                window.dispatchEvent(new CustomEvent('google-auth-success', { detail: JSON.stringify(authData) }));
              } catch (e) {
                console.error('Error fetching Google profile:', e);
              }
            }
          },
        });
      }
    }

    window.launchOfficialGoogleSignIn = function() {
      if (!tokenClient) {
        initGoogleOAuthClient();

      if (tokenClient) {

      } else if (window.google && window.google.accounts && window.google.accounts.id) {
        window.google.accounts.id.prompt();
      }
    };

    // ── Web Push Subscription Helpers ──────────────────────────────────────
    const WORKER_URL = 'https://adhkar-push.wassimbousmaa.workers.dev';
    let cachedVapidKey = null;

    // Pre-fetch and cache VAPID key on page load to keep subscription synchronous
    // and preserve the user gesture context.
    async function prefetchVapidKey() {
      try {
        const resp = await fetch(WORKER_URL + '/api/vapid-key');
        const data = await resp.json();
        cachedVapidKey = data.publicKey;
      } catch (e) {
        console.error('Failed to pre-fetch VAPID key:', e);
      }
    }
    prefetchVapidKey();

    // Convert URL-safe base64 VAPID key to Uint8Array for pushManager.subscribe
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // Convert ArrayBuffer to URL-safe base64 (base64url, no padding)
    // Required by Web Push spec — btoa() produces standard base64 which breaks web-push-neo
    function arrayBufferToBase64Url(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // Fetch the VAPID public key from cache or Worker
    window.getVapidPublicKey = async function() {
      if (cachedVapidKey) return cachedVapidKey;
      try {
        const resp = await fetch(WORKER_URL + '/api/vapid-key');
        const data = await resp.json();
        cachedVapidKey = data.publicKey;
        return cachedVapidKey;
      } catch (e) {
        console.error('Failed to fetch VAPID key:', e);
        return null;
      }
    };

    // Subscribe the browser to Web Push and register with our Worker
    window.subscribeToPush = async function(preferencesJson) {
      try {
        const vapidKey = await window.getVapidPublicKey();
        if (!vapidKey) throw new Error('No VAPID key');

        const registration = await navigator.serviceWorker.ready;
        
        // Check for existing subscription first
        let subscription = await registration.pushManager.getSubscription();
        
        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(vapidKey),
          });
        }

        // Send subscription + preferences to our Worker
        const preferences = JSON.parse(preferencesJson);
        const resp = await fetch(WORKER_URL + '/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subscription: {
              endpoint: subscription.endpoint,
              keys: {
                p256dh: arrayBufferToBase64Url(subscription.getKey('p256dh')),
                auth: arrayBufferToBase64Url(subscription.getKey('auth')),
              },
            },
            preferences: preferences,
          }),
        });

        const result = await resp.json();
        return JSON.stringify({ success: true, endpoint: subscription.endpoint });
      } catch (e) {
        console.error('Push subscribe error:', e);
        return JSON.stringify({ success: false, error: e.message });
      }
    };

    // Unsubscribe from Web Push
    window.unsubscribeFromPush = async function() {
      try {
        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.getSubscription();
        if (subscription) {
          // Tell Worker to remove
          await fetch(WORKER_URL + '/api/unsubscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ endpoint: subscription.endpoint }),
          });
          await subscription.unsubscribe();
        }
        return 'ok';
      } catch (e) {
        console.error('Push unsubscribe error:', e);
        return 'error';
      }
    };

    // Send a test push notification via the Worker
    window.sendTestPushViaWorker = async function() {
      try {
        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.getSubscription();
        if (!subscription) return JSON.stringify({ success: false, error: 'not_subscribed' });

        const resp = await fetch(WORKER_URL + '/api/test-push', {

        const result = await resp.json();
        return JSON.stringify(result);
      } catch (e) {
        console.error('Test push error:', e);
        return JSON.stringify({ success: false, error: e.message });

    // Check if browser has an active push subscription
    window.getPushSubscriptionStatus = async function() {
      try {
        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.getSubscription();
        return subscription ? 'subscribed' : 'not_subscribed';
      } catch (e) {

    window.showImmediateNotification = function(title, body, category) {
      if ('serviceWorker' in navigator && 'Notification' in window && Notification.permission === 'granted') {
        navigator.serviceWorker.ready.then((registration) => {
          registration.showNotification(title, {
            body: body,
            data: { category: category },
            icon: '/icons/Icon-192.png',
            badge: '/icons/Icon-192.png',
            tag: 'adhkar_immediate_' + new Date().getTime(),
            requireInteraction: true,
          });
        }).catch((err) => {
          new Notification(title, { body: body });
        });
      } else if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body: body });
      }
    };

    window.requestNotificationPermission = async function() {
      if (!('Notification' in window)) return 'unsupported';
      const permission = await Notification.requestPermission();
      return permission;
    };

    window.getNotificationPermission = function() {
      if (!('Notification' in window)) return 'unsupported';
      return Notification.permission;
    };

              console.log('Unregistered offline_worker.js');
            }
          }
        });
      }

      // Load Flutter Entrypoint
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: "html",
            useColorEmoji: true
          }).then(function (appRunner) {
            appRunner.runApp().then(function () {
              // Smoothly dismiss splash screen when Flutter UI is rendered
              setTimeout(function () {
                const splash = document.getElementById('app-splash');
                if (splash) {
                  splash.classList.add('fade-out');
                  setTimeout(function () { splash.remove(); }, 500);
                }
              }, 120);
            });
          });
        }
      });
    });
  </script>
</body>
