name: 🚀 Build & Deploy Adhkar Gaza

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Installer Flutter
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Installer les dépendances
      - name: 📦 Get dependencies
        run: flutter pub get

      # 4. Build Flutter Web
      - name: 🔨 Build web release
        run: flutter build web --release --no-tree-shake-icons --pwa-strategy=offline-first

      # 5. Générer le Service Worker offline
      - name: ⚙️ Generate Offline Service Worker
        run: dart run scripts/generate_offline_worker.dart

      # 6. Copier les headers
      - name: 📋 Copy _headers
        run: cp web/_headers build/web/_headers

      # 7. Déployer sur Cloudflare Pages
      - name: 🌐 Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=adhkar-gaza --branch=main
